    <link rel="canonical" href="__PAGE_URL__" />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__PAGE_URL__" />

    <script type="application/ld+json">

    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..800&display=swap"
    />
    <script>
      // Start fetching the landing scene before the app bundle runs (home page only).
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "fetch";
        l.href = "/models/sky.glb";
        l.crossOrigin = "anonymous";
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body class="bg-[#1b1212]">

    <noscript>
